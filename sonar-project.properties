sonar.projectKey=cloudguard
sonar.projectName=CloudGuard Sample Application
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

sonar.sources=app,Dockerfile,requirements.txt,.github
sonar.exclusions=**/test_*.py
sonar.tests=app
sonar.test.inclusions=**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml

# For SonarCloud, uncomment and set your org key:
# sonar.organization=YOUR_SONARCLOUD_ORG
