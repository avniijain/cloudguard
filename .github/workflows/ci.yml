name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: SonarQube / SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

      - name: Skip SonarQube if not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not set. Skipping SonarQube analysis."
          echo "Add repository secrets SONAR_TOKEN and SONAR_HOST_URL to enable this step."

      - name: Build Docker image
        run: docker build -t cloudguard-app:${{ github.sha }} .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy filesystem SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudguard-app:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudguard-app:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: cloudguard-scan-reports
          path: |
            coverage.xml
            trivy-fs.json
            trivy-fs.sarif
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: warn

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
