name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: SonarQube / SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

      - name: Skip SonarQube if not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not set. Skipping SonarQube analysis."
          echo "Add repository secrets SONAR_TOKEN and SONAR_HOST_URL to enable this step."

      - name: Build Docker image
        run: docker build -t cloudguard-app:${{ github.sha }} .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy filesystem SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudguard-app:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudguard-app:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudguard-scan-reports
          path: |
            coverage.xml
            trivy-fs.json
            trivy-fs.sarif
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: warn

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
