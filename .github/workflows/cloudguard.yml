# CloudGuard reusable security pipeline.
#
# Callers must grant at least these permissions on the calling job (or workflow):
#   contents: read
#   security-events: write
#
# Checkout of gate scripts uses job.workflow_repository + job.workflow_sha so the
# scripts match the reusable workflow revision pinned in `uses:` (see GitHub docs
# for job.workflow_*). The optional cloudguard-ref input overrides the SHA when set.
# job.workflow_* is not available on GitHub Enterprise Server; on GHES set cloudguard-ref.
#
# export-image is only needed when the caller also uses cloudguard-publish.yml.
# The file name inside the artifact must stay cloudguard-image.tar.

name: CloudGuard

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for setup-python and test runs
        type: string
        required: false
        default: "3.13"
      dockerfile:
        description: Path to the Dockerfile relative to docker-context
        type: string
        required: false
        default: "Dockerfile"
      docker-context:
        description: Docker build context directory
        type: string
        required: false
        default: "."
      image-name:
        description: Image name (without tag); tagged as image-name:caller-sha
        type: string
        required: true
      run-tests:
        description: When true, install test deps and run test-command
        type: boolean
        required: false
        default: true
      test-install-command:
        description: Shell command to install test dependencies
        type: string
        required: false
        default: "pip install -r requirements.txt"
      test-command:
        description: Shell command to run tests
        type: string
        required: false
        default: "pytest -v --cov --cov-report=xml --cov-report=term"
      risk-gate-mode:
        description: Risk Gate mode — enforce fails the job on BLOCK; report-only never fails the gate
        type: string
        required: false
        default: "enforce"
      policy-file:
        description: Optional policy JSON path in the caller repo; empty uses built-in DEFAULT_POLICY
        type: string
        required: false
        default: ""
      artifact-name:
        description: Upload-artifact name for scan reports (unique per call if you invoke CloudGuard twice)
        type: string
        required: false
        default: "cloudguard-scan-reports"
      cloudguard-ref:
        description: Optional override ref/SHA for checking out CloudGuard scripts; empty uses job.workflow_sha
        type: string
        required: false
        default: ""
      sonar-organization:
        description: SonarCloud organization key; when set, passed as -Dsonar.organization
        type: string
        required: false
        default: ""
      export-image:
        description: Export the scanned image as an artifact so it can be published without rebuilding
        type: boolean
        required: false
        default: false
    secrets:
      SONAR_TOKEN:
        description: SonarQube/SonarCloud token; when absent, Sonar steps are skipped cleanly
        required: false
      SONAR_HOST_URL:
        description: SonarQube/SonarCloud host URL (required together with SONAR_TOKEN when Sonar is used)
        required: false
    outputs:
      decision:
        description: Risk Gate decision (ALLOW, WARN, or BLOCK)
        value: ${{ jobs.cloudguard.outputs.decision }}
      risk-score:
        description: Aggregate risk score from 0 to 100
        value: ${{ jobs.cloudguard.outputs.risk-score }}
      image-tag:
        description: Built image reference (image-name:sha)
        value: ${{ jobs.cloudguard.outputs.image-tag }}
      risk-gate-mode:
        description: Mode the gate ran under (enforce or report-only); deploy jobs should require enforce
        value: ${{ jobs.cloudguard.outputs.risk-gate-mode }}
      image-id:
        description: Image ID of the scanned image, verified again before publishing
        value: ${{ jobs.cloudguard.outputs.image-id }}
      image-artifact:
        description: Name of the artifact holding the exported image
        value: ${{ jobs.cloudguard.outputs.image-artifact }}

permissions:
  contents: read
  security-events: write

jobs:
  cloudguard:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate_outputs.outputs.decision }}
      risk-score: ${{ steps.gate_outputs.outputs.risk-score }}
      image-tag: ${{ steps.image_meta.outputs.image-tag }}
      risk-gate-mode: ${{ steps.mode_meta.outputs.risk-gate-mode }}
      image-id: ${{ steps.export_image.outputs.image-id }}
      image-artifact: ${{ steps.export_image.outputs.artifact }}
    env:
      SONAR_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
      RISK_GATE_MODE: ${{ inputs.risk-gate-mode }}
    steps:
      - name: Validate risk-gate-mode
        env:
          RISK_GATE_MODE: ${{ inputs.risk-gate-mode }}
        run: |
          if [ "$RISK_GATE_MODE" != "enforce" ] && [ "$RISK_GATE_MODE" != "report-only" ]; then
            echo "Invalid risk-gate-mode='$RISK_GATE_MODE' (expected enforce or report-only)"
            exit 2
          fi

      - name: Record mode and warn on report-only
        id: mode_meta
        env:
          RISK_GATE_MODE: ${{ inputs.risk-gate-mode }}
        run: |
          echo "risk-gate-mode=$RISK_GATE_MODE" >> "$GITHUB_OUTPUT"
          if [ "$RISK_GATE_MODE" = "report-only" ]; then
            {
              echo "## CloudGuard mode warning"
              echo ""
              echo "**risk-gate-mode is \`report-only\`.** The Risk Gate will not fail this job on BLOCK."
              echo "Downstream deploy jobs must refuse to run unless \`risk-gate-mode\` output is \`enforce\`."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CloudGuard risk-gate-mode is report-only; BLOCK will not fail the job. Do not deploy from this run unless a later job checks the risk-gate-mode output."
          fi

      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve CloudGuard checkout ref
        id: cloudguard_ref
        env:
          CLOUDGUARD_REF: ${{ inputs.cloudguard-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          if [ -n "$CLOUDGUARD_REF" ]; then
            echo "ref=$CLOUDGUARD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Checkout CloudGuard gate scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.cloudguard_ref.outputs.repository }}
          ref: ${{ steps.cloudguard_ref.outputs.ref }}
          path: .cloudguard
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install test dependencies
        if: ${{ inputs.run-tests }}
        env:
          TEST_INSTALL_COMMAND: ${{ inputs.test-install-command }}
        run: eval "$TEST_INSTALL_COMMAND"

      - name: Run tests with coverage
        if: ${{ inputs.run-tests }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "$TEST_COMMAND"

      - name: Merge Sonar exclusions for .cloudguard
        if: ${{ env.SONAR_CONFIGURED == 'true' }}
        id: sonar_exclusions
        env:
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        run: |
          extra=".cloudguard/**"
          coverage_extra=".cloudguard/**"
          exclusions="$extra"
          coverage_exclusions="$coverage_extra"
          if [ -f sonar-project.properties ]; then
            existing=$(grep -E '^sonar\.exclusions=' sonar-project.properties | head -n1 | cut -d= -f2- | tr -d '\r' || true)
            existing_cov=$(grep -E '^sonar\.coverage\.exclusions=' sonar-project.properties | head -n1 | cut -d= -f2- | tr -d '\r' || true)
            if [ -n "$existing" ]; then
              exclusions="${existing},${extra}"
            fi
            if [ -n "$existing_cov" ]; then
              coverage_exclusions="${existing_cov},${coverage_extra}"
            fi
          fi
          echo "exclusions=$exclusions" >> "$GITHUB_OUTPUT"
          echo "coverage_exclusions=$coverage_exclusions" >> "$GITHUB_OUTPUT"
          if [ -n "$SONAR_ORGANIZATION" ]; then
            echo "organization_arg=-Dsonar.organization=$SONAR_ORGANIZATION" >> "$GITHUB_OUTPUT"
          else
            echo "organization_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube / SonarCloud analysis
        if: ${{ env.SONAR_CONFIGURED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            -Dsonar.exclusions=${{ steps.sonar_exclusions.outputs.exclusions }}
            -Dsonar.coverage.exclusions=${{ steps.sonar_exclusions.outputs.coverage_exclusions }}
            ${{ steps.sonar_exclusions.outputs.organization_arg }}

      - name: Collect SonarQube Quality Gate status
        if: ${{ always() && env.SONAR_CONFIGURED == 'true' }}
        run: python .cloudguard/sonar_status.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Skip SonarQube if not configured
        if: ${{ env.SONAR_CONFIGURED != 'true' }}
        run: |
          echo "SONAR_TOKEN is not set. Skipping SonarQube analysis."
          echo "Add repository secrets SONAR_TOKEN and SONAR_HOST_URL (and pass them into this workflow) to enable this step."

      - name: Record image tag
        id: image_meta
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          tag="${IMAGE_NAME}:${CALLER_SHA}"
          echo "image-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"


      - name: Build Docker image
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.docker-context }}
        run: docker build -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" "$BUILD_CONTEXT"
        

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true
          skip-dirs: .cloudguard

      - name: Trivy filesystem SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true
          skip-dirs: .cloudguard

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy image SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Run CloudGuard Risk Gate
        if: ${{ always() }}
        id: risk_gate
        env:
          POLICY_FILE: ${{ inputs.policy-file }}
        run: |
          set -- \
            --fs-report trivy-fs.json \
            --image-report trivy-image.json \
            --sonar-status sonar-status.json \
            --sonar-configured "${SONAR_CONFIGURED}" \
            --mode "${RISK_GATE_MODE}" \
            --enforce-floor
          if [ -n "$POLICY_FILE" ]; then
            set -- "$@" --policy "$POLICY_FILE"
          fi
          python .cloudguard/risk_gate.py "$@"

      - name: Export gate outputs
        if: ${{ always() }}
        id: gate_outputs
        run: |
          if [ -f risk-decision.json ]; then
            decision=$(python -c "import json; print(json.load(open('risk-decision.json'))['decision'])")
            score=$(python -c "import json; print(json.load(open('risk-decision.json'))['risk_score'])")
          else
            decision="UNKNOWN"
            score=""
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "risk-score=$score" >> "$GITHUB_OUTPUT"

      - name: Export scanned image
        id: export_image
        if: ${{ inputs.export-image && steps.gate_outputs.outputs.decision == 'ALLOW' }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}-image-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker save "$IMAGE_TAG" -o "$RUNNER_TEMP/cloudguard-image.tar"
          echo "image-id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload scanned image
        if: ${{ steps.export_image.outputs.artifact != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.export_image.outputs.artifact }}
          path: ${{ runner.temp }}/cloudguard-image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload scan reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            coverage.xml
            trivy-fs.json
            trivy-fs.sarif
            trivy-image.json
            trivy-image.sarif
            risk-decision.json
            sonar-status.json
          if-no-files-found: warn

      - name: Upload Trivy filesystem SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
